[package]
name = "css-server"
version = "0.1.0"
edition = "2021"

[[bin]]
name = "css-server"
path = "src/main.rs"

[[bin]]
name = "css-webhook-recvr"
path = "src/bin/webhook_recvr.rs"

# The stack tier's mail destination. Same reasoning as css-webhook-recvr: an
# in-repo binary built alongside the server needs no container image, so it adds
# no digest to pin in both e2e/images.env and .reaper.toml, and nothing to pull
# in CI.
[[bin]]
name = "css-smtp-sink"
path = "src/bin/smtp_sink.rs"

[dependencies]
# Workspace dependencies
anyhow = { workspace = true }
tokio = { workspace = true, features = ["full"] }
clap = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
toml = { workspace = true }
uuid = { workspace = true }
chrono = { workspace = true }
chrono-tz = "0.10"
tracing = { workspace = true }
tracing-subscriber = { workspace = true }

# Server-specific dependencies
axum = { version = "0.8", features = ["macros", "ws"] }
futures-util = "0.3"
log = "0.4.28"
config = "0.14"
reqwest = { version = "0.11", features = ["json"] }
thiserror = "1.0"
icalendar = "0.16"

# Diesel ORM and database dependencies
diesel = { version = "2.1.4", features = ["postgres", "chrono", "uuid", "r2d2", "serde_json", "numeric"] }
diesel_migrations = "2.1.0"
dotenvy = "0.15.7"
url = "2.5.7"
rust_decimal = "1.33"
bigdecimal = { version = "0.4", features = ["serde"] }

# MQTT dependencies
paho-mqtt = "0.13"

# JWT and Authentication dependencies
jsonwebtoken = "9.3.0"
argon2 = "0.5.3"
rand_core = { version = "0.6", features = ["getrandom"] }

# Webhook signing (HMAC-SHA256)
hmac = "0.12"
sha2 = "0.10"
hex = "0.4"

# Outbound email (SMTP)
#
# `default-features = false` is load-bearing: lettre's defaults pick a TLS
# backend on your behalf, and a mailer that silently chose one would be a
# second TLS stack nobody decided to add. native-tls is deliberate --
# webauthn-rs 0.5 already forces openssl/openssl-sys into this binary, so
# libssl is a requirement the runtime image carries either way, whereas rustls
# would put a third rustls major into a lock that already carries two.
lettre = { version = "0.11", default-features = false, features = [
    "smtp-transport",
    "builder",
    "tokio1",
    "tokio1-native-tls",
    "hostname",
] }

# Server-side TLS for css-smtp-sink's STARTTLS.
#
# Already in the tree -- reqwest's default-tls and lettre both pull it -- so
# naming it directly adds no build and no system library. The sink needs the
# server half of it, which nothing else here uses.
native-tls = "0.2"

# Multi-factor auth
totp-rs = { version = "5", features = ["gen_secret", "otpauth"] }
webauthn-rs = { version = "0.5", features = ["danger-allow-state-serialisation"] }
base32 = "0.5"
validator = { version = "0.18.1", features = ["derive"] }
# axum-extra = { version = "0.9", default-features = false, features = ["typed-header"] }  # Temporarily disabled
tower = { version = "0.5.2", features = ["util"] }
tower-http = { version = "0.6", features = ["fs", "trace"] }

# Metrics
dr-metrix-core     = "0.1.0"
dr-metrix-axum     = "0.1.0"
dr-metrix-postgres = { version = "0.1.0", default-features = false, features = ["r2d2"] }
prometheus       = { version = "0.13", features = ["process"] }
async-trait = "0.1"
comrak = "0.48.0"
regex = "1.10"
rand = "0.8.5"
css_lib = {path = "../css_lib"}

[features]
# Exposes DatabaseManager::disconnected(), the seam the server-contract tier
# needs. Never enabled by default, so the shipped binary cannot contain it; a
# structural check asserts no [dependencies] entry anywhere turns it on.
test-support = []

[dev-dependencies]
tempfile = "3.0"
# The self-dev-dependency pattern: integration tests in server/tests/ link
# against this crate with test-support on, while the binary does not.
css-server = { path = ".", features = ["test-support"] }
