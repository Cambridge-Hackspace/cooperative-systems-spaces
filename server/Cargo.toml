[package]
name = "css-server"
version = "0.1.0"
edition = "2021"

[[bin]]
name = "css-server"
path = "src/main.rs"

[dependencies]
# Workspace dependencies
anyhow = { workspace = true }
tokio = { workspace = true, features = ["full"] }
clap = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
toml = { workspace = true }
uuid = { workspace = true }
chrono = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }

# Server-specific dependencies
axum = { version = "0.8", features = ["macros"] }
log = "0.4.28"
config = "0.14"
reqwest = { version = "0.11", features = ["json"] }
thiserror = "1.0"
icalendar = "0.16"

# Diesel ORM and database dependencies
diesel = { version = "2.1.4", features = ["postgres", "chrono", "uuid", "r2d2", "serde_json", "numeric"] }
diesel_migrations = "2.1.0"
dotenvy = "0.15.7"
url = "2.5.7"
rust_decimal = "1.33"
bigdecimal = { version = "0.4", features = ["serde"] }

# MQTT dependencies
paho-mqtt = "0.13"

# JWT and Authentication dependencies
jsonwebtoken = "9.3.0"
argon2 = "0.5.3"
rand_core = { version = "0.6", features = ["getrandom"] }
validator = { version = "0.18.1", features = ["derive"] }
# axum-extra = { version = "0.9", default-features = false, features = ["typed-header"] }  # Temporarily disabled
tower = { version = "0.5.2", features = ["util"] }
tower-http = { version = "0.6", features = ["fs", "trace"] }

# Metrics
dr-metrix-core     = "0.1.0"
dr-metrix-axum     = "0.1.0"
dr-metrix-postgres = { version = "0.1.0", default-features = false, features = ["r2d2"] }
prometheus       = { version = "0.13", features = ["process"] }
async-trait = "0.1"
comrak = "0.48.0"
regex = "1.10"
rand = "0.8.5"
css_lib = {path = "../css_lib"}

[dev-dependencies]
tempfile = "3.0"
