[package]
name = "css-server"
version = "0.1.0"
edition = "2021"

[[bin]]
name = "css-server"
path = "src/main.rs"

[dependencies]
# Workspace dependencies
anyhow = { workspace = true }
tokio = { workspace = true, features = ["full"] }
clap = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
toml = { workspace = true }
uuid = { workspace = true }
chrono = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }

# Server-specific dependencies
axum = "0.6.20"
log = "0.4.28"
config = "0.14"
tower-http = { version = "0.6.6", features = ["fs", "trace"] }
axum-prometheus = "0.9.0"
metrics-process = "2.4.0"

# Diesel ORM and database dependencies
diesel = { version = "2.1.4", features = ["postgres", "chrono", "uuid", "r2d2"] }
diesel_migrations = "2.1.0"
dotenvy = "0.15.7"
url = "2.5.7"

# JWT and Authentication dependencies
jsonwebtoken = "9.3.0"
argon2 = "0.5.3"
rand_core = { version = "0.6", features = ["getrandom"] }
validator = { version = "0.18.1", features = ["derive"] }
axum-extra = "0.8.0"
tower = "0.5.0"
hyper = "0.14"
async-trait = "0.1"

[dev-dependencies]
tempfile = "3.0"
