[site]
site_name = "Cooperative Systems Spaces"
site_url = "http://localhost:4399"
admin_url = "http://localhost:4399/admin"
timezone = "UTC"
max_session_age = 1440
debug = false
secret_key = "change-me-in-production"
https = false

[email]
host = "localhost"
port = 587
username = ""
password = ""
use_tls = true
use_ssl = false
from_email = "noreply@example.com"
from_name = "Cooperative Systems Spaces"
enabled = false

[theme]
primary_color = "#007bff"
secondary_color = "#6c757d"
accent_color = "#28a745"
background_color = "#ffffff"
text_color = "#212529"
dark_mode_enabled = true

[stripe]
publishable_key = ""
secret_key = ""
webhook_secret = ""
enabled = false
currency = "USD"
test_mode = true

[reports]
usage_reports_enabled = true
member_reports_enabled = true
financial_reports_enabled = false
generation_frequency_hours = 24
max_reports_retained = 30
default_export_format = "csv"
email_reports = false

[space_directory]
enabled = true
coordinate_format = "decimal"
max_spaces_per_directory = 1000
search_enabled = true
filtering_enabled = true
default_visibility = "public"
allow_anonymous_viewing = true

[sentry]
environment = "development"
traces_sample_rate = 0.1
enabled = false
performance_monitoring = false

[database]
host = "localhost"
port = 5432
database = "css"
username = "css_user"
password = "css_pass"
url = "postgresql://css_user:css_pass@localhost:5432/css"
max_connections = 10
min_connections = 1
connect_timeout_seconds = 30
idle_timeout_seconds = 600
log_statements = false
auto_migrate = true

[server]
bind_address = "127.0.0.1:4399"
log_requests = true
request_timeout_seconds = 30
max_request_body_size = 16777216
cors_enabled = true
cors_origins = ["http://localhost:3000"]

[auth]
jwt_secret = "your-super-secret-jwt-key-change-this-in-production"
jwt_expiration_hours = 24
allow_registration = true
require_email_verification = false
password_min_length = 8
session_timeout_minutes = 1440
password_reset_enabled = true

[registration_challenge]
enabled = false
hint = "Ask a current member for the registration phrase"
phrase = "makers welcome here"
throttle_enabled = true
throttle_attempts = 5
throttle_seconds = 300
terms_of_service_checkbox = true
terms_of_service_md = "By registering, you agree to the [terms of service](https://example.com/terms-of-service)"
recaptcha_enabled = false
recaptcha_site_key = ""
recaptcha_secret_key = ""

[initial_setup]
setup_enabled = true
setup_admin_email = "firstadmin@example.com"

[user]
profile_fields = []
profiles_enabled = true

[[tools.tool_categories]]
value = "saw"
label = "Saw"

[[tools.tool_categories]]
value = "powertool"
label = "Power Tools"

[[tools.tool_categories]]
value = "hand_tools"
label = "Hand Tools"

[[tools.tool_categories]]
value = "measuring"
label = "Measuring"

[[tools.tool_categories]]
value = "safety"
label = "Safety"

[[tools.tool_categories]]
value = "electronics"
label = "Electronics"

[[tools.tool_categories]]
value = "woodworking"
label = "Woodworking"

[[tools.tool_categories]]
value = "metalworking"
label = "Metalworking"

[[tools.tool_categories]]
value = "3d_printing"
label = "3D Printing"

[[tools.tool_categories]]
value = "laser_cutting"
label = "Laser Cutting"

[[tools.tool_categories]]
value = "welding"
label = "Welding"

[[tools.tool_categories]]
value = "other"
label = "Other"

[toolguard]
enabled = true
profile_field = "card_id"

[calendar]
enabled = false
cache_duration_minutes = 15
max_events_display = 10
lookahead_days = 30

[[calendar.calendars]]
ical_link = "https://example.com/calendar.ics"
name = "Example Calendar"
color = "#3788d8"
enabled = false

[pages]
wiki_repo = "https://github.com/neiam/css-wiki-example"
wiki_link = "Both"
wiki_auto_enabled = false
wiki_period = 600
wiki_readme = false
site_repo = "https://github.com/neiam/css-site-example"
site_link = "Both"
site_auto_enabled = false
site_period = 600
site_embed_index = "INDEX.md"
site_readme = false
users_pages_enabled = false
user_profile_field = "user_page_repository"
user_period = 900
user_readme = true

[edge]
edge_enabled = false
