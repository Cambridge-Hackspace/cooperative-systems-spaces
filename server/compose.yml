version: "2"
services:
  postgres:
    image: postgres:17
    container_name: css_postgres
    # #120 (low): bind to loopback only. Publishing on all interfaces (0.0.0.0)
    # exposed the database (password css_pass) and the brokers to the whole LAN.
    ports:
      - 127.0.0.1:5432:5432
    environment:
      POSTGRES_DB: css
      POSTGRES_USER: css_user
      POSTGRES_PASSWORD: css_pass
    volumes:
      - postgres_data:/var/lib/postgresql/data
  mosquitto:
    image: eclipse-mosquitto:2.0.18
    container_name: css_mosquitto
    ports:
      - 127.0.0.1:1883:1883
    volumes:
      - ./mosquitto.conf:/mosquitto/config/mosquitto.conf:Z
  mosquitto-3883:
    image: eclipse-mosquitto:2.0.18
    container_name: css_mosquitto_3883
    ports:
      - 127.0.0.1:3883:3883
    volumes:
      - ./mosquitto-3883.conf:/mosquitto/config/mosquitto.conf:Z
volumes:
  postgres_data:
