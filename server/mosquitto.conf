# DEVELOPMENT / E2E ONLY. #120 (#121): `allow_anonymous true` lets anyone reach
# the broker publish to any device's command topics (open any door, forge audit
# events). Production MUST require per-device auth + topic ACLs + TLS instead --
# see docs/mqtt-broker-security.md. Do not deploy this file as-is.
listener 1883
allow_anonymous true

# Logging configuration
log_dest stdout
log_type all
connection_messages true
log_timestamp true
log_timestamp_format %Y-%m-%dT%H:%M:%S
