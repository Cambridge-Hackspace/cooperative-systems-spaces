name: CI

# This is the gate. reaper is the pre-push loop and runs the same suites on an
# ephemeral machine, but nothing here depends on reaper existing: every job
# below provisions what it needs.

on:
  push:
    branches: [master, dev]
  pull_request:
    branches: [master, dev]
  # Manually runnable, and the reason is that without it this workflow could not
  # be verified at all. It triggers only on master/dev and on pull requests
  # targeting them -- which is the right policy for a project, and it means a
  # feature branch can carry a rewritten CI configuration that has never once
  # executed. That was the state of this file for the whole of the work that
  # produced it: aligned, reviewed, and unrun.
  #
  # `gh workflow run CI --ref <branch>` now exercises it before it is merged,
  # which is the only way to find out whether the --provision=external path
  # works before it is the thing gating everybody's pushes.
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# Which machine the Linux jobs run on.
#
# Unset -- the default -- means GitHub-hosted `ubuntu-latest`. An undefined
# repository variable evaluates to the empty string, which is falsy in a GitHub
# expression, so the fallback applies with nothing configured anywhere. Set the
# repository or organisation variable `CI_RUNNER` to a self-hosted label (this
# project's upstream uses `arc-runner-set`) to send them elsewhere.
#
# It is a variable because it was a hardcoded `arc-runner-set` for two and a
# half months, and that made the workflow unrunnable anywhere except the one
# organisation those runners are registered to. Forks do not inherit a parent's
# self-hosted runners -- deliberately, since inheriting them would let any fork
# execute arbitrary code on the parent's infrastructure. So on a fork every job
# here sat `queued` against a runner that could never claim it, until GitHub
# cancelled it at the twenty-four hour mark. Nothing failed, nothing reported,
# and the repository's Actions tab stayed empty through a merge to master.
#
# The expression is repeated at each job rather than defined once because the
# `env` context is not available in `runs-on`. `vars` is.

env:
  CARGO_TERM_COLOR: always

jobs:
  # ---------------------------------------------------------------------------
  # frontend_edge/dist is embedded into the edge crate by include_dir! at compile
  # time, so every Rust job needs it to exist AND to contain the real bundle.
  #
  # This job is that dependency, expressed as one. It replaces
  # `mkdir -p /builds/<org>/<repo>/edge/../frontend_edge/dist`, which hardcoded a
  # single runner's checkout path and produced an *empty* embedding -- a binary
  # that compiles cleanly and serves 404 for its own UI. edge/build.rs now
  # guarantees the directory exists at all; this guarantees it has something in it.
  # ---------------------------------------------------------------------------
  assets:
    runs-on: ${{ vars.CI_RUNNER || 'ubuntu-latest' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: |
            frontend/package-lock.json
            frontend_edge/package-lock.json
      - name: Build frontend_edge
        working-directory: frontend_edge
        run: npm ci --no-audit --no-fund && npm run build
      - name: Build frontend
        working-directory: frontend
        env:
          PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: '1'
        run: npm ci --no-audit --no-fund && npm run build
      - name: Assert the bundles are real, not empty
        run: |
          test -s frontend/dist/index.html
          test -s frontend_edge/dist/index.html
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: |
            frontend/dist
            frontend_edge/dist
          if-no-files-found: error
          retention-days: 1

  # --- Tiers 1 and 2, plus lint/format/type ----------------------------------
  frontend:
    runs-on: ${{ vars.CI_RUNNER || 'ubuntu-latest' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '24', cache: npm, cache-dependency-path: frontend/package-lock.json }
      - working-directory: frontend
        env:
          PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: '1'
        run: npm ci --no-audit --no-fund
      - name: Format
        working-directory: frontend
        run: npm run format:check
      - name: Lint
        working-directory: frontend
        run: npm run lint
      - name: Type-check
        working-directory: frontend
        run: npm run type-check
      # The strictness ratchet. Shrinking tsconfig.strict.json's include list is
      # a narrowing and needs a stated reason; growing it is the unit of work.
      - name: Type-check (strict ratchet)
        working-directory: frontend
        run: npm run type-check:strict
      - name: Test
        working-directory: frontend
        run: npm run test:coverage
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: frontend-test-results
          path: |
            frontend/test-results/
            frontend/coverage/
          if-no-files-found: error

  frontend-edge:
    runs-on: ${{ vars.CI_RUNNER || 'ubuntu-latest' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '24', cache: npm, cache-dependency-path: frontend_edge/package-lock.json }
      - working-directory: frontend_edge
        run: npm ci --no-audit --no-fund
      - working-directory: frontend_edge
        run: npm run format:check
      - working-directory: frontend_edge
        run: npm run lint
      - working-directory: frontend_edge
        run: npm run type-check
      # Stricter than frontend's equivalent and deliberately not a ratchet:
      # this directory is 565 lines and its base tsconfig is already
      # `"strict": true`, so noUncheckedIndexedAccess and noImplicitOverride
      # apply to all of it rather than to a growing list.
      - working-directory: frontend_edge
        run: npm run type-check:strict
      - working-directory: frontend_edge
        run: npm run build

  # --- The e2e suite's own code, and the Tier 9 oracle ------------------------
  # Runs on every PR and costs seconds. It needs no stack, and the tier it
  # validates does not run on every PR -- which is exactly why the thing that
  # decides whether that tier means anything should.
  shell:
    runs-on: ${{ vars.CI_RUNNER || 'ubuntu-latest' }}
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update && sudo apt-get install -y --no-install-recommends shellcheck
      - uses: mfinelli/setup-shfmt@v3
      - uses: actions/setup-node@v4
        with: { node-version: '24' }
      - run: ./e2e/lint.sh

  # --- Tiers 1, 1b, 3 and 4, Rust side ---------------------------------------
  rust:
    runs-on: ${{ vars.CI_RUNNER || 'ubuntu-latest' }}
    needs: assets
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with: { name: dist, path: . }
      - name: System dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential pkg-config libssl-dev libpq-dev cmake \
            libasound2-dev libudev-dev
      # actions-rs/* has been archived and unmaintained since 2023.
      - uses: dtolnay/rust-toolchain@stable
        with: { components: rustfmt, clippy }
      - uses: Swatinem/rust-cache@v2

      - name: Format
        run: cargo fmt --all -- --check

      # `cargo test --bin css-server` was a *target filter*: it ran only unit
      # tests inside that one binary, excluded css_lib entirely, and silently
      # ignored every tests/ directory in the workspace -- so an integration
      # test could be added and never run once. --all-targets is what picks
      # them up.
      - name: Test
        run: cargo test --locked --all-targets
      - name: Doc tests
        run: cargo test --locked --doc

      # kiosk and the two toolguard UIs are outside default-members on purpose
      # (d78227d) because bevy and egui are heavy. Compile-checking them stops
      # them rotting without paying to link them.
      - name: Check the full workspace, including the GUI crates
        run: cargo check --locked --workspace --all-targets

  # --- Tier 5: the real app against the fake API ------------------------------
  # In the pinned Playwright image, which carries its own browsers -- which is
  # why PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD=1 is set in every other job and why the
  # package.json pin and this image tag have to agree. They do: 1.62.1.
  #
  # No database, no broker and no css-server: the fake is a Vite middleware, so
  # this job needs the frontend and nothing else. It is also the only job in
  # this workflow that runs a browser at all.
  browser-fake:
    runs-on: ${{ vars.CI_RUNNER || 'ubuntu-latest' }}
    container:
      image: mcr.microsoft.com/playwright:v1.62.1-noble
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '24', cache: npm, cache-dependency-path: frontend/package-lock.json }
      - working-directory: frontend
        env:
          PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: '1'
        run: npm ci --no-audit --no-fund
      - name: Run the browser tier
        working-directory: frontend
        env:
          CI: '1'
          PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: '1'
        run: npx playwright test --config playwright.config.ts
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: browser-fake-results
          path: |
            frontend/test-results/
            frontend/playwright-report/
          if-no-files-found: error

  # --- Tier 4's DB-backed half, and tiers 6-8 --------------------------------
  # A `services:` Postgres, so this needs no reaper and no container engine of
  # its own. e2e/run.sh --provision=external takes the endpoint from the
  # environment rather than starting anything.
  #
  # No continue-on-error and no `if:` guard. If this cannot run, that is a
  # runner defect to fix, not a suite to skip.
  stack:
    runs-on: ${{ vars.CI_RUNNER || 'ubuntu-latest' }}
    # Deliberately NOT `needs: assets`. This job runs e2e/build.sh, which is the
    # same script the reaper session runs, and that script builds both frontends
    # itself. Downloading the bundle instead would leave build.sh -- the thing
    # every session depends on -- exercised only where reaper exists.
    needs: rust
    timeout-minutes: 60
    services:
      postgres:
        # Deliberately not UTF-8, and this is the configuration that found the
        # migration this suite could not apply: an ellipsis in a SQL comment
        # made the schema impossible to create on a LATIN1 cluster, invisibly,
        # because every developer machine and every default runner is UTF-8.
        #
        # lc_collate=C also makes every "alphabetical" list an actual assertion,
        # and lc_ctype=C means no case folding outside ASCII, which exercises
        # case-insensitive email and username lookup for real.
        image: postgres:18-bookworm
        env:
          POSTGRES_DB: css
          POSTGRES_USER: css_user
          POSTGRES_PASSWORD: css_pass
          # The same flags e2e/stack.sh passes, so the two environments
          # provision the same cluster rather than two similar ones.
          POSTGRES_INITDB_ARGS: '--encoding=LATIN1 --lc-collate=C --lc-ctype=C'
          # Not UTC. The schema stage asserts this, because chrono::Local falls
          # back to UTC when tzdata is absent and every timezone check
          # downstream would then be a no-op that passes.
          TZ: America/Chicago
          PGTZ: America/Chicago
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U css_user -d css"
          --health-interval 5s --health-timeout 5s --health-retries 20
    env:
      CSS_TEST_DATABASE_URL: postgres://css_user:css_pass@localhost:5432/css
      # The driver reads CSS_-prefixed names. A bare FUZZ_ITERATIONS was read by
      # nothing and the fuzz tier quietly ran its default.
      CSS_FUZZ_ITERATIONS: '600'
      CSS_RACE_ROUNDS: '4'
    steps:
      - uses: actions/checkout@v4
      - name: System dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential pkg-config libssl-dev libpq-dev cmake \
            libasound2-dev libudev-dev \
            postgresql-client mosquitto
          # mosquitto's package starts a broker on 1883 with its own
          # configuration. The suite starts its own, pointed at a config it
          # wrote, so the packaged service has to be out of the way first --
          # otherwise the port is taken and the failure reads as a bind error.
          sudo systemctl stop mosquitto 2>/dev/null || true
          sudo systemctl disable mosquitto 2>/dev/null || true
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      # Node for the API, fuzz and concurrency drivers. e2e/build.sh will
      # bootstrap its own if this step is ever removed, but using the runner's
      # is faster and is the version the frontend jobs use.
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: |
            frontend/package-lock.json
            frontend_edge/package-lock.json
      - name: Build everything the stack runs
        run: ./e2e/build.sh
      - name: Run the stack tiers
        run: ./e2e/run.sh --provision=external
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: e2e-results
          path: e2e/out/
          if-no-files-found: error

  # --- packaging --------------------------------------------------------------
  docker-server:
    needs: [frontend, frontend-edge, rust, shell, stack, browser-fake]
    # Publishing only. There is nothing for this job to do on a branch it will
    # not push from, and without this guard it still checks out, authenticates
    # to the registry and exits -- a job that reports success for having done
    # nothing, on every feature branch forever.
    if: github.ref_name == 'master' || github.ref_name == 'dev'
    runs-on: ${{ vars.CI_RUNNER || 'ubuntu-latest' }}
    permissions: { contents: read, packages: write }
    steps:
      - uses: actions/checkout@v4
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and push (master)
        if: github.ref_name == 'master'
        run: |
          docker build -t ghcr.io/${{ github.repository }}/app:${{ github.sha }} \
                       -t ghcr.io/${{ github.repository }}/app:latest .
          docker push ghcr.io/${{ github.repository }}/app:${{ github.sha }}
          docker push ghcr.io/${{ github.repository }}/app:latest
      - name: Build and push (dev)
        if: github.ref_name == 'dev'
        run: |
          docker build -t ghcr.io/${{ github.repository }}/app:${{ github.sha }} \
                       -t ghcr.io/${{ github.repository }}/app:dev .
          docker push ghcr.io/${{ github.repository }}/app:${{ github.sha }}
          docker push ghcr.io/${{ github.repository }}/app:dev

  docker-edge:
    needs: [frontend, frontend-edge, rust, shell, stack, browser-fake]
    if: github.ref_name == 'master' || github.ref_name == 'dev'
    runs-on: ${{ vars.CI_RUNNER || 'ubuntu-latest' }}
    permissions: { contents: read, packages: write }
    steps:
      - uses: actions/checkout@v4
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and push (master)
        if: github.ref_name == 'master'
        run: |
          docker build -f Dockerfile.edge \
            -t ghcr.io/${{ github.repository }}/edge:${{ github.sha }} \
            -t ghcr.io/${{ github.repository }}/edge:latest .
          docker push ghcr.io/${{ github.repository }}/edge:${{ github.sha }}
          docker push ghcr.io/${{ github.repository }}/edge:latest
      - name: Build and push (dev)
        if: github.ref_name == 'dev'
        run: |
          docker build -f Dockerfile.edge \
            -t ghcr.io/${{ github.repository }}/edge:${{ github.sha }} \
            -t ghcr.io/${{ github.repository }}/edge:dev .
          docker push ghcr.io/${{ github.repository }}/edge:${{ github.sha }}
          docker push ghcr.io/${{ github.repository }}/edge:dev

  release:
    needs: [frontend, frontend-edge, rust, shell, stack, browser-fake]
    # Three operating systems building three binaries each. Worth paying for at
    # the gate and not on every push to every branch.
    #
    # Pull requests are included deliberately: the Windows and macOS legs are
    # the only cross-platform coverage this project has, they break
    # independently of the Linux build, and upstream's pipeline is red right now
    # for exactly that reason. Catching it after the merge is catching it late.
    if: >-
      github.event_name == 'pull_request' ||
      github.event_name == 'workflow_dispatch' ||
      github.ref_name == 'master' || github.ref_name == 'dev'
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ${{ vars.CI_RUNNER || 'ubuntu-latest' }}
            artifact_name: linux
            server_bin: css-server
            cli_bin: css-cli
            edge_bin: css-edge
            build_server: true
          - os: windows-latest
            artifact_name: windows
            server_bin: css-server.exe
            cli_bin: css-cli.exe
            edge_bin: css-edge.exe
            build_server: false
          - os: macos-latest
            artifact_name: macos
            server_bin: css-server
            cli_bin: css-cli
            edge_bin: css-edge
            build_server: false
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '24' }
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2

      - name: Install PostgreSQL client library (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          choco install postgresql --yes --no-progress
          $pg = Get-ChildItem 'C:\Program Files\PostgreSQL' -ErrorAction SilentlyContinue |
                Sort-Object Name -Descending | Select-Object -First 1
          if (-not $pg) { Write-Error "PostgreSQL not found"; exit 1 }
          $prefix = $pg.FullName
          Add-Content -Path $env:GITHUB_ENV -Value "PATH=${prefix}\bin;${env:PATH}"
          Add-Content -Path $env:GITHUB_ENV -Value "LIB=${prefix}\lib;${env:LIB}"
          Add-Content -Path $env:GITHUB_ENV -Value "INCLUDE=${prefix}\include;${env:INCLUDE}"

      # openssl-sys reaches this leg by three independent routes, two of which
      # build here: css-cli and css-edge both pull reqwest -> native-tls, and
      # css-edge additionally pulls paho-mqtt -> paho-mqtt-sys, which compiles
      # the Paho C library and locates OpenSSL through CMake rather than through
      # openssl-sys. So pointing only OPENSSL_DIR at an installation fixes the
      # Rust half and leaves the C half looking somewhere else; OPENSSL_ROOT_DIR
      # is what CMake reads.
      #
      # Swapping the TLS stack would not avoid this. rustls would take reqwest
      # out of the picture and paho-mqtt-sys would still need OpenSSL, so the
      # dependency change would be large, would alter what the shipped binaries
      # negotiate, and would not remove the requirement.
      #
      # This is the same shape as the PostgreSQL step above: a system library
      # the build needs and a Windows runner does not ship.
      - name: Install OpenSSL (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          choco install openssl --yes --no-progress
          $candidates = @(
            'C:\Program Files\OpenSSL-Win64',
            'C:\Program Files\OpenSSL',
            'C:\Program Files\FireDaemon OpenSSL 3'
          )
          $ssl = $candidates | Where-Object { Test-Path (Join-Path $_ 'include\openssl\ssl.h') } |
                 Select-Object -First 1
          if (-not $ssl) {
            Write-Error "OpenSSL headers not found after install; looked in: $($candidates -join ', ')"
            exit 1
          }
          Write-Host "OpenSSL at $ssl"
          Add-Content -Path $env:GITHUB_ENV -Value "OPENSSL_DIR=$ssl"
          Add-Content -Path $env:GITHUB_ENV -Value "OPENSSL_ROOT_DIR=$ssl"

      - name: Install PostgreSQL client library (macOS)
        if: runner.os == 'macOS'
        run: |
          brew update && brew install libpq
          prefix=$(brew --prefix libpq)
          echo "LDFLAGS=-L${prefix}/lib" >> $GITHUB_ENV
          echo "CPPFLAGS=-I${prefix}/include" >> $GITHUB_ENV
          echo "PKG_CONFIG_PATH=${prefix}/lib/pkgconfig" >> $GITHUB_ENV

      - name: Install build dependencies (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential pkg-config libssl-dev libpq-dev cmake \
            libasound2-dev libudev-dev

      - name: Build the edge bundle
        working-directory: frontend_edge
        run: npm ci --no-audit --no-fund && npm run build
      - name: Assert the bundle is real
        shell: bash
        run: test -s frontend_edge/dist/index.html

      - run: cargo build --locked --release --bin css-cli
      - run: cargo build --locked --release --bin css-edge
      - if: matrix.build_server
        run: cargo build --locked --release --bin css-server

      # This is a workspace: cargo writes to <root>/target/release, never to
      # cli/target/release, and the binary is `css-cli`, not `css`. The previous
      # paths matched nothing on every platform, and upload-artifact defaults to
      # `if-no-files-found: warn` -- so the CLI release artifact has been
      # silently empty for as long as this job has existed. `error` is what makes
      # that impossible to repeat.
      - uses: actions/upload-artifact@v4
        with:
          name: css-cli-${{ matrix.artifact_name }}
          path: target/release/${{ matrix.cli_bin }}
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        with:
          name: css-edge-${{ matrix.artifact_name }}
          path: target/release/${{ matrix.edge_bin }}
          if-no-files-found: error
      # Only where it was actually built. This previously uploaded css-server on
      # Windows and macOS, where the build step was gated on Linux.
      - if: matrix.build_server
        uses: actions/upload-artifact@v4
        with:
          name: css-server-${{ matrix.artifact_name }}
          path: target/release/${{ matrix.server_bin }}
          if-no-files-found: error
