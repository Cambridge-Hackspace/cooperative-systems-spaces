name: CI

on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]

jobs:
  checks:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        job: [frontend, server, cli]
    steps:
      - uses: actions/checkout@v4

      # FRONTEND JOBS
      - name: Set up Node.js
        if: matrix.job == 'frontend'
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install frontend dependencies
        if: matrix.job == 'frontend'
        working-directory: frontend
        run: npm ci

      - name: Run frontend build
        if: matrix.job == 'frontend'
        working-directory: frontend
        run: npm run build

      #- name: Run frontend tests
      #  if: matrix.job == 'frontend'
      #  working-directory: frontend
      #  run: npm run test -- --ci --coverage

      # BACKEND JOBS (SERVER & CLI)
      - name: Set up Rust
        if: matrix.job == 'server' || matrix.job == 'cli'
        uses: actions-rs/toolchain@v1
        with:
          toolchain: stable
          override: true
          profile: minimal

      - name: Run server checks
        if: matrix.job == 'server'
        working-directory: server
        run: |
          cargo test --all
#          cargo fmt --all -- --check
#          cargo clippy --all-targets --all-features -- -D warnings


      - name: Run cli checks
        if: matrix.job == 'cli'
        working-directory: cli
        run: |
          cargo test --all
#          cargo fmt --all -- --check
#          cargo clippy --all-targets --all-features -- -D warnings=

  docker:
    needs: checks
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build Docker image
        run: |
          docker build -t ghcr.io/${{ github.repository }}/app:${{ github.sha }} .

      - name: Push Docker image
        run: |
          docker push ghcr.io/${{ github.repository }}/app:${{ github.sha }}
          docker push ghcr.io/${{ github.repository }}/app:latest
  release:
    needs: checks
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ ubuntu-latest, windows-latest, macos-latest ]
        include:
          - os: ubuntu-latest
            artifact_name: linux
            asset_name: css-linux
          - os: windows-latest
            artifact_name: windows
            asset_name: css-windows.exe
          - os: macos-latest
            artifact_name: macos
            asset_name: css-macos
    steps:
      - uses: actions/checkout@v4

      - name: Set up Rust
        uses: actions-rs/toolchain@v1
        with:
          toolchain: stable
          override: true
          profile: minimal

      - name: Build CLI
        working-directory: cli
        run: cargo build --release

      - name: Build Server
        run: cargo build --release

      - name: Upload CLI artifacts
        uses: actions/upload-artifact@v3
        with:
          name: cli-${{ matrix.artifact_name }}
          path: cli/target/release/${{ matrix.asset_name }}

      - name: Upload Server artifacts
        uses: actions/upload-artifact@v3
        with:
          name: server-${{ matrix.artifact_name }}
          path: server/target/release/${{ matrix.asset_name }}
