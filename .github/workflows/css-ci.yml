name: CI

on:
  push:
    branches: [ master, dev ]
  pull_request:
    branches: [ master, dev ]

jobs:
  checks:
    runs-on: arc-runner-set
    strategy:
      matrix:
        job: [frontend, server, cli, edge]
    steps:
      - uses: actions/checkout@v4

      # ARC's default runner image ships no compilers
      - run: sudo apt-get update && sudo apt-get install -y --no-install-recommends build-essential pkg-config libssl-dev

      # FRONTEND JOBS
      - name: Set up Node.js
        if: matrix.job == 'frontend' || matrix.job == 'edge'
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install frontend dependencies
        if: matrix.job == 'frontend'
        working-directory: frontend
        run: npm ci

      - name: Run frontend build
        if: matrix.job == 'frontend'
        working-directory: frontend
        run: npm run build

      - name: Install frontend-edge dependencies
        if: matrix.job == 'frontend' || matrix.job == 'edge'
        working-directory: frontend_edge
        run: npm ci

      - name: Run frontend-edge build
        if: matrix.job == 'frontend' || matrix.job == 'edge'
        working-directory: frontend_edge
        run: npm run build



      #- name: Run frontend tests
      #  if: matrix.job == 'frontend'
      #  working-directory: frontend
      #  run: npm run test -- --ci --coverage

      # BACKEND JOBS (SERVER & CLI & EDGE)
      - name: Install addtl development libraries
        if: (matrix.job == 'edge') && runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libasound2-dev libudev-dev

      - name: Set up Rust
        if: matrix.job == 'server' || matrix.job == 'cli' || matrix.job == 'edge'
        uses: actions-rs/toolchain@v1
        with:
          toolchain: stable
          override: true
          profile: minimal

      - name: Run server checks
        if: matrix.job == 'server'
        working-directory: server
        run: |
          cargo test --bin css-server
#          cargo fmt --bin css-server
#          cargo clippy --all-targets --all-features -- -D warnings=

      - name: Run cli checks
        if: matrix.job == 'cli'
        working-directory: cli
        run: |
          cargo test --bin css-cli
#          cargo fmt --bin css-cli
#          cargo clippy --all-targets --all-features -- -D warnings=

      - name: Run edge checks
        if: matrix.job == 'edge'
        working-directory: edge
        run: |
          cargo test --bin css-edge
#          cargo fmt --bin css-edge
#          cargo clippy --all-targets --all-features -- -D warnings=

  docker-server:
    needs: checks
    runs-on: arc-runner-set
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build Docker image
        if: github.ref_name == 'master'
        run: |
          docker build -t ghcr.io/${{ github.repository }}/app:${{ github.sha }} -t ghcr.io/${{ github.repository }}/app:latest .

      - name: Push Docker image
        if: github.ref_name == 'master'
        run: |
          docker push ghcr.io/${{ github.repository }}/app:${{ github.sha }}
          docker push ghcr.io/${{ github.repository }}/app:latest

      - name: Build Dev Docker image
        if: github.ref_name == 'dev'
        run: |
          docker build -t ghcr.io/${{ github.repository }}/app:${{ github.sha }} -t ghcr.io/${{ github.repository }}/app:dev .

      - name: Push Dev Docker image
        if: github.ref_name == 'dev'
        run: |
          docker push ghcr.io/${{ github.repository }}/app:dev
          docker push ghcr.io/${{ github.repository }}/app:${{ github.sha }}

  docker-edge:
    needs: checks
    runs-on: arc-runner-set
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build Docker image
        if: github.ref_name == 'master'
        run: |
          docker build -t ghcr.io/${{ github.repository }}/edge:${{ github.sha }} -t ghcr.io/${{ github.repository }}/edge:latest -f Dockerfile.edge  .

      - name: Push Docker image
        if: github.ref_name == 'master'
        run: |
          docker push ghcr.io/${{ github.repository }}/edge:${{ github.sha }}
          docker push ghcr.io/${{ github.repository }}/edge:latest

      - name: Build Dev Docker image
        if: github.ref_name == 'dev'
        run: |
          docker build -t ghcr.io/${{ github.repository }}/edge:${{ github.sha }} -t ghcr.io/${{ github.repository }}/edge:dev -f Dockerfile.edge  .

      - name: Push Dev Docker image
        if: github.ref_name == 'dev'
        run: |
          docker push ghcr.io/${{ github.repository }}/edge:dev


  release:
    needs: checks
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ arc-runner-set, windows-latest, macos-latest ]
        include:
          - os: arc-runner-set
            artifact_name: linux
            asset_name: css-server
            asset_name_cli: css
          - os: windows-latest
            artifact_name: windows
            asset_name: css-server.exe
            asset_name_cli: css.exe
          - os: macos-latest
            artifact_name: macos
            asset_name: css-server
            asset_name_cli: css
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Set up Rust
        uses: actions-rs/toolchain@v1
        with:
          toolchain: stable
          override: true
          profile: minimal

      - name: Install PostgreSQL client library (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          choco install postgresql --yes --no-progress
          $pg = Get-ChildItem 'C:\Program Files\PostgreSQL' -ErrorAction SilentlyContinue |
                Sort-Object Name -Descending | Select-Object -First 1
          if (-not $pg) { Write-Error "PostgreSQL not found in C:\Program Files\PostgreSQL"; exit 1 }
          $prefix = $pg.FullName
          Write-Host "Postgres prefix: $prefix"
          Add-Content -Path $env:GITHUB_ENV -Value "PG_PREFIX=$prefix"
          Add-Content -Path $env:GITHUB_ENV -Value "PATH=${prefix}\bin;${env:PATH}"
          Add-Content -Path $env:GITHUB_ENV -Value "LIB=${prefix}\lib;${env:LIB}"
          Add-Content -Path $env:GITHUB_ENV -Value "INCLUDE=${prefix}\include;${env:INCLUDE}"
          Add-Content -Path $env:GITHUB_ENV -Value "LIBRARY_PATH=${prefix}\lib;${env:LIBRARY_PATH}"

      - name: Install PostgreSQL client library (macOS)
        if: runner.os == 'macOS'
        run: |
          brew update
          brew install libpq
          prefix=$(brew --prefix libpq)
          echo "LDFLAGS=-L${prefix}/lib" >> $GITHUB_ENV
          echo "CPPFLAGS=-I${prefix}/include" >> $GITHUB_ENV
          echo "PKG_CONFIG_PATH=${prefix}/lib/pkgconfig" >> $GITHUB_ENV

      - name: Install PostgreSQL client library (Ubuntu)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y build-essential pkg-config libssl-dev libpq-dev

      - name: Install Edge Client Libraries
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libasound2-dev libudev-dev

      - name: Install frontend dependencies
        working-directory: frontend_edge
        run: npm ci

      - name: Run frontend build
        working-directory: frontend_edge
        run: npm run build

      - name: Build CLI
        run: cargo build --release --bin css-cli

      - name: Build Edge
        run: cargo build --release --bin css-edge

      - name: Build Server
        if: runner.os == 'Linux'
        run: cargo build --release --bin css-server

      - name: Upload CLI artifacts
        uses: actions/upload-artifact@v4
        with:
          name: css-cli-${{ matrix.artifact_name }}
          path: cli/target/release/${{ matrix.asset_name_cli }}

      - name: Upload Server artifacts
        uses: actions/upload-artifact@v4
        with:
          name: css-server-${{ matrix.artifact_name }}
          path: target/release/${{ matrix.asset_name }}
