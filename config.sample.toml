# Cooperative Systems Spaces Configuration File
# This file contains all configurable settings for the application.
# Copy this file to config.toml and modify values as needed for your environment.

# JWT Authentication Configuration
[auth]
# Secret key for JWT token signing (CHANGE THIS IN PRODUCTION!)
jwt_secret = "your-super-secret-jwt-key-change-this-in-production"
# Token expiration time in hours
jwt_expiration_hours = 24
# Enable user registration
allow_registration = true
# Require email verification for new accounts
require_email_verification = false
# Minimum password length
password_min_length = 8
# Session timeout in minutes
session_timeout_minutes = 1440
# Enable password reset functionality
password_reset_enabled = true

# Registration Challenge Configuration
# Use this to require a passphrase or challenge question for new registrations
[registration_challenge]
# Enable the registration challenge requirement
enabled = false
# Hint to display to users about what the challenge might be
hint = "Ask a current member for the registration phrase"
# The exact phrase users must enter (case-sensitive)
phrase = "makers welcome here"
# Enable Throttling
throttle_enabled = true
# How many attempts before throttling
throttle_attempts = 3
# cooloff period
throttle_seconds = 180
# Enable the terms of service checkbox
terms_of_service_checkbox = true
# The TOS markdown
terms_of_service_md = "By registering, you agree to our [Terms of Service](https://example.com/terms) and [Privacy Policy](https://example.com/privacy)."
# Enable the recaptcha integration
recaptcha_enabled = false
# site key
recaptcha_site_key = ""
# secret key
recaptcha_secret_key = ""

# Initial Setup Configuration
[initial_setup]
# Enable initial setup mode - first user with matching email gets admin role
setup_enabled = true
# Email address of the intended first admin user
setup_admin_email = "admin@example.com"

# Site Configuration
# These settings control the basic site identity and behavior
[site]
# The display name of your site
site_name = "Cooperative Systems Spaces"
# The main URL where your site is accessible (include protocol)
site_url = "http://localhost:4399"
# URL for the administrative interface
admin_url = "http://localhost:4399/admin"
# Default timezone for date/time display
timezone = "UTC"
# Session timeout in minutes (1440 = 24 hours)
max_session_age = 1440
# Enable debug mode (shows detailed error messages)
debug = false
# Secret key for cryptographic operations (CHANGE THIS IN PRODUCTION!)
secret_key = "change-me-in-production"
# Force HTTPS for all connections
https = false
# Optional: Google Analytics or similar tracking ID
# analytics_id = "GA-XXXXXXXXX"

# Email Configuration
# Settings for sending emails (notifications, password resets, etc.)
[email]
# SMTP server hostname
host = "localhost"
# SMTP server port (587 for TLS, 465 for SSL, 25 for unencrypted)
port = 587
# SMTP username for authentication
username = ""
# SMTP password for authentication
password = ""
# Use TLS encryption (recommended for port 587)
use_tls = true
# Use SSL encryption (for port 465)
use_ssl = false
# Default sender email address
from_email = "noreply@example.com"
# Display name for the sender
from_name = "Cooperative Systems Spaces"
# Enable or disable email functionality entirely
enabled = false

# Theme Configuration
# Customize the visual appearance of your site
[theme]
# Primary brand color (used for headers, buttons, etc.)
primary_color = "#007bff"
# Secondary color (used for less prominent elements)
secondary_color = "#6c757d"
# Accent color (used for highlights and special elements)
accent_color = "#28a745"
# Main background color
background_color = "#ffffff"
# Primary text color
text_color = "#212529"
# Path to custom CSS file (optional)
# custom_css_file = "/path/to/custom.css"
# URL or path to your site logo (optional)
# logo_url = "/static/images/logo.png"
# URL or path to your site favicon (optional)
# favicon_url = "/static/images/favicon.ico"
# Enable dark mode toggle for users
dark_mode_enabled = true

# Stripe Payment Configuration
# Settings for processing payments (if enabled)
[stripe]
# Stripe publishable key (starts with pk_)
publishable_key = ""
# Stripe secret key (starts with sk_)
secret_key = ""
# Webhook endpoint secret for Stripe events
webhook_secret = ""
# Enable Stripe payment processing
enabled = false
# Currency code for payments (ISO 4217 format)
currency = "USD"
# Use test mode (true for development, false for production)
test_mode = true

# Report Configuration
# Settings for generating and managing reports
[reports]
# Enable usage tracking reports
usage_reports_enabled = true
# Enable member management reports
member_reports_enabled = true
# Enable financial reports (requires payment integration)
financial_reports_enabled = false
# How often to generate reports (in hours)
generation_frequency_hours = 24
# Maximum number of reports to keep in storage
max_reports_retained = 30
# Default export format for reports (csv, json, pdf)
default_export_format = "csv"
# Automatically email reports to administrators
email_reports = false

# Space Directory Configuration
# Settings for the cooperative spaces directory and mapping
[space_directory]
# Enable the space directory feature
enabled = true
# Format for displaying coordinates (decimal, dms)
coordinate_format = "decimal"
# Maximum spaces allowed per directory listing
max_spaces_per_directory = 1000
# Enable search functionality within directories
search_enabled = true
# Enable filtering options (by type, size, etc.)
filtering_enabled = true
# Default visibility for new spaces (public, members, private)
default_visibility = "public"
# Allow non-members to view space listings
allow_anonymous_viewing = true

# Sentry Error Tracking Configuration
# Settings for error monitoring and performance tracking
[sentry]
# Sentry DSN for error reporting (optional)
# dsn = "https://your-dsn@sentry.io/project-id"
# Environment name for Sentry (development, staging, production)
environment = "development"
# Sample rate for performance monitoring (0.0 to 1.0)
traces_sample_rate = 0.1
# Enable Sentry error tracking
enabled = false
# Enable performance monitoring
performance_monitoring = false
# Release version for Sentry tracking (optional)
# release = "1.0.0"

# Database Configuration
# PostgreSQL database connection settings
[database]
# Full database connection URL
url = "postgresql://css_user:css_pass@postgres:5432/css"
# Individual connection parameters (used if url is not provided)
host = "postgres"
port = 5432
database = "css"
username = "css_user"
password = "css_pass"
# Maximum number of concurrent database connections
max_connections = 10
# Minimum number of connections to maintain in the pool
min_connections = 1
# Timeout for establishing database connections (seconds)
connect_timeout_seconds = 30
# Timeout for idle connections before cleanup (seconds)
idle_timeout_seconds = 600
# Log SQL statements for debugging (disable in production)
log_statements = false
# Automatically run database migrations on startup
auto_migrate = true

# Server Configuration
# Settings for the web server itself
[server]
# IP address and port to bind the server to
bind_address = "127.0.0.1:4399"
# Enable request logging
log_requests = true
# Timeout for individual requests (seconds)
request_timeout_seconds = 30
# Maximum size for request bodies (bytes, 16MB default)
max_request_body_size = 16777216
# Enable Cross-Origin Resource Sharing (CORS)
cors_enabled = true
# List of allowed origins for CORS requests
cors_origins = ["http://localhost:3000"]

