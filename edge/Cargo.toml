[package]
name = "css-edge"
version = "0.3.0"
edition = "2021"

[[bin]]
name = "css-edge"
path = "src/main.rs"

[dependencies]
# Workspace dependencies
anyhow = { workspace = true }
tokio = { workspace = true, features = ["full"] }
clap = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
toml = { workspace = true }
uuid = { workspace = true }
chrono = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }

# Edge-specific dependencies
rand = "0.8"
reqwest = { version = "0.12", features = ["json"] }
mac_address = "1.1"
get_if_addrs = "0.5"
paho-mqtt = "0.13"

# Web server dependencies
axum = { version = "0.7", features = ["ws"] }
tower = { version = "0.5", features = ["util"] }
tower-http = { version = "0.6", features = ["fs", "trace", "cors"] }
mime_guess = "2.0"
rust-embed = "8.0"
include_dir = "0.7.4"

css_lib = {path = "../css_lib"}
hex = "0.4"

# WebSocket transport (alternative to MQTT)
tokio-tungstenite = { version = "0.24", features = ["rustls-tls-native-roots"] }
# DECLARED HERE EVEN THOUGH TUNGSTENITE ALREADY PULLS IT, because tungstenite
# enables rustls with DEFAULT FEATURES OFF -- so neither provider feature
# arrived, and rustls 0.23 panics the first time a TLS config is built when it
# cannot determine one. That was #207: the WebSocket task died on every boot
# while the rest of the edge kept working, so the edge showed offline and its
# own log said nothing above INFO. Naming rustls here makes the provider this
# crate's decision instead of a side effect of someone else's feature list.
#
# aws_lc_rs and not ring: ML-KEM lives only in rustls's aws_lc_rs provider, and
# `prefer-post-quantum` is defined as ["aws_lc_rs"], so ring would opt the
# control plane out of hybrid key exchange. Dockerfile.edge's builder already
# installs cmake, which is aws-lc-sys's only extra build requirement.
rustls = { version = "0.23", features = ["aws_lc_rs", "prefer-post-quantum"] }
futures-util = "0.3"
url = "2"

[dev-dependencies]
tempfile = "3.8"
