[package]
name = "css-cli"
version = "0.1.0"
edition = "2021"

[[bin]]
name = "css-cli"
path = "src/main.rs"

[[bin]]
name = "toolpass-client"
path = "src/bin/toolpass_client.rs"

[dependencies]
# Workspace dependencies
anyhow = { workspace = true }
tokio = { workspace = true, features = ["full"] }
clap = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
toml = { workspace = true }
uuid = { workspace = true }
chrono = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }

# CLI-specific dependencies
reqwest = { version = "0.11", features = ["json", "rustls-tls"] }
url = "2.5.7"
dirs = "5.0"
rpassword = "7.3"
tabled = "0.15"
indicatif = "0.17"
console = "0.15"
dialoguer = "0.11"
csv = "1.3"
serde_yaml = "0.9"
config = "0.14"