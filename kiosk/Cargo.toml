[package]
name = "kiosk"
version = "0.1.0"
edition = "2021"

[[bin]]
name = "kiosk"
path = "src/main.rs"

[dependencies]
winit = { version = "0.30", features = ["wayland-dlopen"] }
bevy = { version = "0.18"}
#bevy = { version = "0.18", default-features = false, features = [
#    "bevy_asset",
#    "bevy_color",
#    "bevy_core_pipeline",
#    "bevy_image",
#    "bevy_render",
#    "bevy_sprite",
#    "bevy_state",
#    "bevy_text",
#    "bevy_ui",
#    "bevy_winit",
#    "default_font",
#    "multi_threaded",
#    "png",
#    "tonemapping_luts",
#    "wayland",
#    "x11",
#    "zstd_rust",
#] }
paho-mqtt = { version = "0.13", default-features = false, features = ["bundled"] }
serde = { workspace = true }
serde_json = { workspace = true }
toml = { workspace = true }
chrono = { workspace = true }

[package.metadata.deb]
name = "css-kiosk"
maintainer = "Cooperative Systems"
section = "utils"
priority = "optional"
extended-description = "Cooperative Systems Spaces kiosk display application"
# libwayland-client0 is dlopen'd at runtime; mesa/GPU drivers are site-specific
depends = "$auto, libwayland-client0"
assets = [
    { source = "target/release/kiosk", dest = "/usr/bin/css-kiosk", mode = "755" },
    { source = "config.sample.toml", dest = "/etc/xdg/css-kiosk/kiosk.toml", mode = "644" },
    { source = "css-kiosk.desktop", dest = "/usr/share/applications/css-kiosk.desktop", mode = "644" },
]
conf-files = ["/etc/xdg/css-kiosk/kiosk.toml"]
